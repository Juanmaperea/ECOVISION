services:
  # =========================
  # BACKEND
  # =========================
  - type: web
    name: ecovision-backend
    runtime: docker
    rootDir: backend

    # Al establecer rootDir, estas rutas son relativas a /backend
    dockerfilePath: ./Dockerfile
    dockerContext: .

    plan: free
    region: oregon
    autoDeploy: true

    envVars:
      # Render inyectará la conexión interna de PostgreSQL
      - key: DATABASE_URL
        fromDatabase:
          name: ecovision-db
          property: connectionString

      

      - key: FRONTEND_URL
        sync: false

  # =========================
  # FRONTEND VITE
  # =========================
  - type: web
    name: ecovision-frontend
    runtime: static
    rootDir: frontendEcovision

    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true

    envVars:
      - key: VITE_API_URL
        sync: false

    # Necesario si React/Vue maneja rutas desde el navegador
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# =========================
# POSTGRESQL
# =========================
databases:
  - name: ecovision-db
    databaseName: ecovision
    user: ecovision_app
    postgresMajorVersion: "17"
    plan: free
    region: oregon

    # Impide conexiones públicas; el backend usa la red interna.
    ipAllowList: []