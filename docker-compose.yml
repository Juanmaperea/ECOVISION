version: "3.9"

services:

  postgres:

    image: postgres:17

    container_name: ecovision_postgres

    restart: always

    environment:

      POSTGRES_DB: ecovision

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  backend:

    build:

      context: ./backend

    container_name: ecovision_backend

    restart: always

    depends_on:

      - postgres

    ports:

      - "8000:8000"

    env_file:

      - ./backend/.env

    volumes:

      - ./backend:/app

volumes:

  postgres_data: