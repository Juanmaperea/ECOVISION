name: EcoVision Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        run: |
          cat > .env << EOF
          APP_NAME=EcoVision API
          APP_VERSION=1.0.0
          APP_ENV=test

          HOST=0.0.0.0
          PORT=8000

          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=ecovision
          DB_USER=postgres
          DB_PASSWORD=postgres

          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

          YOLO_MODEL=yolov8n.pt

          LOG_LEVEL=INFO
          EOF

      - name: Check syntax
        run: |
          python -m compileall app

      - name: Run tests
        run: |
          pytest --cov=app --cov-report=term